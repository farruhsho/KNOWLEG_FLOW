name: Deploy backend (manual)

# Deploys Firestore rules + indexes, Storage rules and Cloud Functions to the
# production project. Manual only: run it after the owner has chosen the
# Firestore/Functions region and set secrets (see functions/README.md).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "firebase deploy --only targets"
        required: true
        default: "firestore:rules,firestore:indexes,storage,functions"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g firebase-tools@15
      - name: Install and test functions
        working-directory: functions
        run: npm ci && npm test
      - name: Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        run: firebase deploy --project knowleg-33f36 --only "${{ github.event.inputs.only }}" --non-interactive
