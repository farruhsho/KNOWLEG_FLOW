name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

jobs:
  # Analyze and Test
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the branch was verified with (analyze, tests,
          # gen-l10n output). The old 3.16.0 pin broke pub get (CI-01).
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Localization files are up to date
        run: flutter gen-l10n && git diff --exit-code lib/l10n

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
        continue-on-error: true

  # Cloud Functions: typecheck + unit tests + build (Node 22 runtime).
  functions:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Content pipeline: schema/dedup/assembly/import tests + typecheck.
  content-pipeline:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/content_pipeline } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/content_pipeline/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  # Security rules + end-to-end backend tests on the Firebase emulators
  # (firebase-tools >= 15 needs Java 21). demo-* projects never touch real Firebase.
  emulator-tests:
    needs: functions
    runs-on: ubuntu-latest
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g firebase-tools@15
      - name: Build functions
        run: npm ci && npm run build
        working-directory: functions
      - name: Security rules tests (Firestore + Storage)
        run: npm install && npm test
        working-directory: tests/rules
      - name: End-to-end tests (Auth + Firestore + Functions + Storage)
        run: npm install && npm test
        working-directory: tests/e2e

  # Build Android
  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner's default JDK (25) cannot run Gradle 8.12; build with the
      # same JDK 21 the branch was verified with locally.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the branch was verified with (analyze, tests, gen-l10n output).
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # google-services.json and the upload keystore are not in git. With the
      # repository secrets set, CI builds the signed release bundle; without
      # them it still proves the Android build compiles (debug APK with a
      # placeholder Firebase config, never uploadable).
      - name: Restore Firebase config and signing key
        id: android-secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: compile check only (debug APK, placeholder Firebase config)"
            echo '{"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.example.knowledge_flow"}},"oauth_client":[],"api_key":[{"current_key":"ci-placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          fi

      - name: Build App Bundle (release)
        if: steps.android-secrets.outputs.release == 'true'
        run: flutter build appbundle --release --dart-define=BILLING_MODE=${{ vars.BILLING_MODE || 'external' }}

      - name: Build debug APK (compile check)
        if: steps.android-secrets.outputs.release != 'true'
        run: flutter build apk --debug

      - name: Upload App Bundle
        if: steps.android-secrets.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # Build iOS
  # iOS is not a release target yet (docs/modernization/TZ.md): informational.
  # Run manually (Actions → Flutter CI/CD → Run workflow): macOS runners are
  # scarce (PR runs were cancelled for lack of capacity) and iOS is not a
  # release target yet.
  build-ios:
    if: github.event_name == 'workflow_dispatch'
    needs: analyze-test
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the branch was verified with (analyze, tests, gen-l10n output).
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
