name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Analyze and Test
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Use the stable channel (Dart >= 3.9.2) instead of pinning 3.16.0,
          # which shipped Dart ~3.2 and broke `flutter pub get` against the
          # pubspec sdk constraint ^3.9.2 (CI-01).
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
        continue-on-error: true

  # Cloud Functions: typecheck + unit tests + build (Node 22 runtime).
  functions:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Content pipeline: schema/dedup/assembly/import tests + typecheck.
  content-pipeline:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/content_pipeline } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/content_pipeline/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  # Security rules + end-to-end backend tests on the Firebase emulators
  # (firebase-tools >= 15 needs Java 21). demo-* projects never touch real Firebase.
  emulator-tests:
    needs: functions
    runs-on: ubuntu-latest
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g firebase-tools@15
      - name: Build functions
        run: npm ci && npm run build
        working-directory: functions
      - name: Security rules tests (Firestore + Storage)
        run: npm install && npm test
        working-directory: tests/rules
      - name: End-to-end tests (Auth + Firestore + Functions + Storage)
        run: npm install && npm test
        working-directory: tests/e2e

  # Build Android
  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # google-services.json and the upload keystore are not in git; provide
      # them as base64 repository secrets. Without the keystore the bundle is
      # signed with the debug key (fine as a CI artifact, NOT uploadable).
      - name: Restore Firebase config and signing key
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then echo "::error::secret GOOGLE_SERVICES_JSON_BASE64 is missing"; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            printf '%s
' "$KEY_PROPERTIES" > android/key.properties
          else
            echo "::warning::no upload keystore secrets: bundle will be debug-signed"
          fi

      - name: Build App Bundle
        run: flutter build appbundle --release --dart-define=BILLING_MODE=${{ vars.BILLING_MODE || 'external' }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # Build iOS
  build-ios:
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
